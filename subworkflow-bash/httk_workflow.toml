# The same parent workflow as ../subworkflow, with a Bash runner. It calls the
# same child workflow, examples.subworkflow-child, which is written in Python:
# a caller and the workflow it calls need not share a language, because a call
# names a workflow, not code.
#
# As in ../subworkflow, this package declares only the parent; each child job
# carries ../subworkflow-child's declaration.

[workflow]
name = "examples.subworkflow-bash"
description = "call another workflow once per value, gather the calls, and add up their results, in Bash"
declaration_uri = "https://example.org/httk/workflows-examples/declarations/subworkflow-bash"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1"]

[workflow.runner]
entry = "run.sh"
steps = ["start", "aggregate", "report_failures"]
initial_step = "start"

[workflow.parameters.values]
# The same JSON array as ../subworkflow's; run.sh takes it apart with
# httk_workflow_parameter_items, one element per line, so plain Bash needs no
# JSON parser.
type = "array"
default = [1, 4, 9]
description = "The numbers to take roots of; one call of the child workflow per value."

# The same declared dependency as ../subworkflow (see the comments there):
# run.sh calls the alias `child`.
[workflow.calls]
child = "examples.subworkflow-child"
