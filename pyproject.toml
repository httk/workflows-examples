[build-system]
requires = []
build-backend = "workflow_repository_build"
backend-path = ["tools"]

[project]
name = "workflows-examples"
dynamic = ["version"]
description = "Teaching examples of httk workflow packages (not production workflows)"
requires-python = ">=3.12"
dependencies = ["httk-workflow>=2.1.1", "httk-workflow-vasp>=0.1.0", "httk-atomistic>=2.1.2"]

[tool.httk.workflow-repository]
repository = "git+https://github.com/httk/workflows-examples"

[tool.ruff]
target-version = "py312"
src = ["tests"]
line-length = 120
# The executable instantiate hook is Python but must not carry a .py suffix
# (that would select the in-process hook form); naming it here makes
# `ruff check .` and `ruff format --check .` cover it.
extend-include = ["vasp-relax-bash-annotated/instantiate"]
