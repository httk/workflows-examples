[tool.ruff]
target-version = "py312"
src = ["tests"]
line-length = 120
# The executable instantiate hook is Python but must not carry a .py suffix
# (that would select the in-process hook form); naming it here makes
# `ruff check .` and `ruff format --check .` cover it.
extend-include = ["vasp-relax-bash-annotated/instantiate"]
