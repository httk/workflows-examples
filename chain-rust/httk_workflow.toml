# The middle of the three-language chain, a compiled Rust workflow. It is called
# by examples.chain (Python) and itself calls examples.chain-leaf (Python).
#
# A compiled package is published as *sources only*; each workspace builds and
# registers its own binary in the foreground, before jobs run. Installing it
# (`httk workflow install --workspace WORKSPACE examples.chain-rust`, by name
# for an installed plugin or by path, `./chain-rust`, for a checkout, or by
# installing a workflow that calls it) builds it unless given `--no-build`;
# it is rebuilt with
#
#     httk workflow build --workspace WORKSPACE examples.chain-rust
#
# Managers never build. A workflow that declares this one in its
# [workflow.calls] (../chain) is not even claimed until this binary is built
# on the manager's platform.

[workflow]
name = "examples.chain-rust"
description = "call examples.chain-leaf and extend its trail, in Rust: the middle of the chain"
declaration_uri = "https://example.org/httk/workflows-examples/declarations/chain-rust"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1"]

[workflow.runner]
# No `entry`: the runner is the compiled binary. `{artifacts}` is the
# directory of this machine's registered build of this package.
command = ["{artifacts}/chain"]
steps = ["start", "finish", "leaf_failed"]
initial_step = "start"

# The workflow this one calls, by alias: main.rs calls "leaf". Declared calls
# are known before anything runs (see ../subworkflow/httk_workflow.toml).
[workflow.calls]
leaf = "examples.chain-leaf"

[workflow.build]
# The Makefile copies the installed Rust SDK crate in and runs cargo offline.
command = "make"
# One registration per machine class: a binary is not portable across them.
platform = "uname -sm"
# What the build produces. Artifacts are stripped before publication, so they
# never enter the source digest or a transfer.
artifacts = ["chain", "target", "Cargo.lock"]
