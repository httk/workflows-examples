# A workflow that uses another workflow: it calls examples.hello (the `hello`
# package of this repository) as a child job and builds on its result.

[workflow]
name = "examples.compose"
description = "call another workflow, wait for it, and use its result"
requires = ["httk-workflow>=2.1.1"]

[workflow.runner]
entry = "run.py"
steps = ["start", "finish", "dependency_failed"]
initial_step = "start"

[workflow.parameters.name]
type = "string"
default = "composer"
description = "Who the called workflow greets."

# The workflow this one calls, by alias: the runner calls `hello`, never a
# workflow name. It is installed with this workflow (`httk workflow install`
# and `httk job new --install` install declared calls too), and a job may call
# only what is declared here. To call it from its git repository instead, pin
# the git URI to a full commit:
#   hello = "git+https://github.com/httk/workflows-examples@<full commit>#hello"
[workflow.calls]
hello = "examples.hello"
