# The bottom of the three-language chain: examples.chain (Python) calls
# examples.chain-rust (Rust), which calls this Python workflow. See the
# comments in ../chain/run.py for the whole picture.

[workflow]
name = "examples.chain-leaf"
description = "start a trail file: the bottom of the three-language chain"
declaration_uri = "https://example.org/httk/workflows-examples/declarations/chain-leaf"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1"]

[workflow.runner]
entry = "run.py"
steps = ["start_trail"]
