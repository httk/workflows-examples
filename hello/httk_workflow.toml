# The smallest useful workflow package: a name, a runner, and the version of
# httk-workflow it needs. Everything else a manifest can say (inputs,
# parameters, outputs, hooks, declarations) is optional;
# vasp-relax-annotated/httk_workflow.toml shows all of it.

[workflow]
# The workflow's name. It is written into every job's job.json, and once this
# package has been installed in a workspace it is also the short name that
# selects it (`httk job new --workflow examples.hello`).
name = "examples.hello"
description = "write a greeting to a file: the smallest possible workflow"
# The minimum distribution versions this workflow needs, checked when a job
# is created and again when a manager claims it.
requires = ["httk-workflow>=2.1.1"]

[workflow.runner]
# The executable in this directory that the manager runs; here a Python
# program. Any executable member will do: without `entry` the manager runs a
# file called `run`, but a descriptive name such as run.py or run.sh says what
# the file is and keeps editors and linters working. `steps` must list exactly
# the steps that runner registers; with a single step it is also the first one.
entry = "run.py"
steps = ["greet"]
