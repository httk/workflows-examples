# The top of the three-language chain: this Python workflow calls
# examples.chain-rust (Rust), which calls examples.chain-leaf (Python). See the
# comments in `run.py`. Each of the three packages has its own declaration,
# and each of the three jobs carries its own workflow's.

[workflow]
name = "examples.chain"
description = "call a Rust workflow that calls a Python workflow, and finish their trail"
declaration_uri = "https://example.org/httk/workflows-examples/declarations/chain"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1"]

[workflow.runner]
entry = "run.py"
steps = ["start", "finish", "middle_failed"]
initial_step = "start"

# The workflow this one calls, by alias: run.py calls "middle". Because the
# dependency is declared, a job of this workflow is refused at creation if
# examples.chain-rust is unknown, and a manager does not claim it until
# chain-rust is *built* on its machine: `httk job why` and
# `httk workflow precheck` name it as not built. One command builds it:
#     httk workflow build examples.chain
# builds every compiled workflow this one declares it calls, transitively
# (here chain-rust; chain-leaf needs no build). A git dependency goes here as
# a commit-pinned URI, never in the code.
[workflow.calls]
middle = "examples.chain-rust"
